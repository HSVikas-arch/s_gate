{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3" style="border-color: rgba(255,255,255,0.1) !important;">
    <div>
        <h2 class="mb-1 fw-bold"><i class="fa-solid fa-chart-pie text-primary me-2"></i>System Statistics</h2>
        <p class="text-muted mb-0">Overview of platform usage and entity counts.</p>
    </div>
    <a href="/dashboard" class="btn btn-outline-light btn-sm" style="border-color: rgba(255,255,255,0.2);">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
    </a>
</div>

<div class="row mt-4">
    <div class="col-md-4 mb-4">
        <div class="card stat-card p-4 text-center h-100 border-0 shadow-sm">
            <div class="mb-3">
                <div class="d-inline-flex p-3 rounded-circle" style="background: var(--primary-glow);">
                    <i class="fa-solid fa-users fa-2x text-primary"></i>
                </div>
            </div>
            <h5>Registered Users</h5>
            <h2>{{ users }}</h2>
        </div>
    </div>

    <div class="col-md-4 mb-4">
        <div class="card stat-card p-4 text-center h-100 border-0 shadow-sm">
            <div class="mb-3">
                <div class="d-inline-flex p-3 rounded-circle" style="background: rgba(16, 185, 129, 0.1);">
                    <i class="fa-solid fa-file-shield fa-2x text-success"></i>
                </div>
            </div>
            <h5>Secure Documents</h5>
            <h2>{{ documents }}</h2>
        </div>
    </div>

    <div class="col-md-4 mb-4">
        <div class="card stat-card p-4 text-center h-100 border-0 shadow-sm">
            <div class="mb-3">
                <div class="d-inline-flex p-3 rounded-circle" style="background: rgba(245, 158, 11, 0.1);">
                    <i class="fa-solid fa-list-check fa-2x text-warning"></i>
                </div>
            </div>
            <h5>Total Audit Logs</h5>
            <h2>{{ audits }}</h2>
        </div>
    </div>
</div>

{% endblock %}
