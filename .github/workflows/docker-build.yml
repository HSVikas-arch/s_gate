name: Build and Verify Docker Image

on:
  push:
    branches: [ "master" ] # ⚡ Triggers the pipeline automatically every time you push code!

jobs:
  build-pipeline:
    runs-on: ubuntu-latest # Runs on a free, isolated cloud server hosted by GitHub

    steps:
    - name: Checkout Code from GitHub
      uses: actions/checkout@v4

    - name: Setup Docker Environment
      uses: docker/setup-buildx-action@v3

    - name: Run Build Test
      run: |
        docker build -t securegate-app:latest .
        echo "Success! The Docker container builds perfectly with no errors."
